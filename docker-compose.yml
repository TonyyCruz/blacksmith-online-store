services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blacksmith-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/blacksmith
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: blacksmith-postgres
    environment:
      POSTGRES_DB: blacksmith
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blacksmith"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
